<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surfing Obaachama</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #eaf6fb;
    margin: 0;
    padding: 24px;
    text-align: center;
    color: #1b3a4b;
  }
  h1 { margin-bottom: 4px; }
  .sub { color: #4a6b7a; margin-top: 0; }
  .edit-banner {
    display: none;
    background: #fff3cd;
    color: #7a5b00;
    border: 1px solid #e0c060;
    border-radius: 8px;
    padding: 8px 14px;
    max-width: 520px;
    margin: 10px auto;
    font-size: 14px;
  }
  .edit-banner.show { display: block; }
  .stage {
    position: relative;
    display: inline-block;
    max-width: 560px;
    width: 100%;
    margin-top: 10px;
    user-select: none;
  }
  .stage img { width: 100%; display: block; border-radius: 10px; }
  .hotspot {
    position: absolute;
    width: 5.6%;
    min-width: 18px;
    min-height: 18px;
    aspect-ratio: 1 / 1;
    background: rgba(255, 210, 60, 0.55);
    border: 2px solid #ffb700;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
    animation: pulse 1.8s infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hotspot.correct { background: rgba(80, 220, 120, 0.7); border-color: #26a349; animation: none; }
  .hotspot.wrong { background: rgba(240, 80, 80, 0.7); border-color: #c0392b; animation: none; }
  .hotspot .dot-label {
    display: none;
    position: absolute;
    top: -26px;
    left: 50%;
    transform: translateX(-50%);
    background: #1b3a4b;
    color: white;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
  }
  .hotspot.show-label .dot-label { display: block; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,183,0,0.5); }
    70% { box-shadow: 0 0 0 12px rgba(255,183,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,183,0,0); }
  }
  .controls { margin-top: 18px; }
  button {
    background: #1b6d8c;
    color: white;
    border: none;
    padding: 10px 18px;
    margin: 4px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: #145469; }
  #quizFeedback {
    margin-top: 12px;
    min-height: 24px;
    font-size: 17px;
    font-weight: 600;
  }
  .export-box { display: none; max-width: 560px; margin: 16px auto; text-align: left; }
  .export-box.show { display: block; }
  #exportText { width: 100%; height: 140px; font-family: monospace; font-size: 12px; }
  #wordBox {
    display: none;
    max-width: 480px;
    margin: 18px auto 0;
    background: white;
    border: 2px solid #1b6d8c;
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 17px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  #wordBox.show { display: block; }
  #wordBox .word { font-weight: 700; font-size: 20px; color: #1b6d8c; margin-bottom: 4px; }
</style>
</head>
<body>

<p class="sub">Tap or click any glowing circle. Claude will say the word out loud and use it in a sentence.</p>

</div>

<div class="export-box" id="exportBox">
  <p>Copy this and paste it back to Claude so the corrections can be saved permanently:</p>
  <textarea id="exportText" readonly onclick="this.select()"></textarea>
</div>

<div class="controls">
  <button id="replayBtn">🔁 Replay last</button>
  <button id="quizBtn">🎯 Quiz me</button>
  <button id="revealBtn">👁️ Show all labels</button>
  <button id="editBtn">✏️ Fix hotspots</button>
</div>

<div id="wordBox">
  <div class="word" id="wordBoxWord"></div>
  <div id="wordBoxSentence"></div>
</div>

<div id="quizFeedback"></div>

<script>
const parts = [
  { id: "hair",    label: "Hair",              x: 47, y: 10, sentence: "Her silver hair is piled up in a big, curly bun." },
  { id: "shaka",   label: "Shaka Hand Sign",    x: 12, y: 42, sentence: "She flashes the shaka hand sign to say hello and relax." },
  { id: "glasses", label: "Glasses",            x: 43, y: 25, sentence: "Her red glasses help her spot the best waves." },
  { id: "shirt",   label: "Short Sleeve Hawaiian Shirt", x: 45, y: 55, sentence: "She ties her green short sleeve Hawaiian shirt up at the waist to stay cool." },
  { id: "earrings",label: "Puka Shell Earrings",x: 34, y: 30, sentence: "Her dangly puka shell earrings sway as she talks." },
  { id: "flipflops", label: "Flip-Flop Sandals", x: 43, y: 92, sentence: "Her red flip-flop sandals are perfect for walking on the sand." }
];

const stage = document.getElementById('stage');
const img = document.getElementById('mainImg');
let lastSentence = "";
let editMode = false;
let quizMode = false;
let quizQueue = [];
let quizAnswer = null;

function pickEnglishVoice(){
  const voices = window.speechSynthesis.getVoices() || [];
  if(voices.length === 0) return null;
  const preferredNames = ["Samantha","Google US English","Microsoft Zira Online (Natural) - English (United States)","Microsoft Zira","Microsoft David","Alex","Karen","Daniel","Google UK English Female"];
  for(const name of preferredNames){
    const v = voices.find(v => v.name === name);
    if(v) return v;
  }
  let v = voices.find(v => v.lang === "en-US");
  if(v) return v;
  v = voices.find(v => v.lang === "en-GB");
  if(v) return v;
  v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  return v || null;
}

function speak(text) {
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 0.95;
  utter.lang = "en-US";
  const voice = pickEnglishVoice();
  if(voice) utter.voice = voice;
  window.speechSynthesis.speak(utter);
}
if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
}

function say(part) {
  lastSentence = part.label + ". " + part.sentence;
  speak(lastSentence);
  document.getElementById('wordBoxWord').textContent = part.label;
  document.getElementById('wordBoxSentence').textContent = part.sentence;
  document.getElementById('wordBox').classList.add('show');
}

function renderHotspots() {
  document.querySelectorAll('.hotspot').forEach(el => el.remove());
  parts.forEach(part => {
    const el = document.createElement('div');
    el.className = 'hotspot';
    el.dataset.id = part.id;
    el.style.left = part.x + '%';
    el.style.top = part.y + '%';
    const labelEl = document.createElement('span');
    labelEl.className = 'dot-label';
    labelEl.textContent = part.label;
    el.appendChild(labelEl);

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (editMode) {
        const newLabel = prompt("Label for this hotspot:", part.label);
        if (newLabel !== null && newLabel.trim() !== "") part.label = newLabel.trim();
        const newSentence = prompt("Sentence for this hotspot:", part.sentence);
        if (newSentence !== null && newSentence.trim() !== "") part.sentence = newSentence.trim();
        renderHotspots();
        return;
      }
      if (quizMode) {
        handleQuizClick(part, el);
        return;
      }
      say(part);
    });

    if (editMode) {
      el.style.cursor = 'grab';
      el.addEventListener('mousedown', startDrag);
      el.addEventListener('touchstart', startDrag, { passive: false });
    }

    stage.appendChild(el);
  });
}

function startDrag(e) {
  e.preventDefault();
  e.stopPropagation();
  const el = e.currentTarget;
  const partId = el.dataset.id;
  const part = parts.find(p => p.id === partId);

  function move(ev) {
    const rect = stage.getBoundingClientRect();
    const point = ev.touches ? ev.touches[0] : ev;
    let x = ((point.clientX - rect.left) / rect.width) * 100;
    let y = ((point.clientY - rect.top) / rect.height) * 100;
    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));
    part.x = x;
    part.y = y;
    el.style.left = x + '%';
    el.style.top = y + '%';
  }
  function up() {
    document.removeEventListener('mousemove', move);
    document.removeEventListener('mouseup', up);
    document.removeEventListener('touchmove', move);
    document.removeEventListener('touchend', up);
    updateExportBox();
  }
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', up);
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('touchend', up);
}

function updateExportBox() {
  const lines = parts.map(p =>
    `  { id: "${p.id}", label: "${p.label}", x: ${p.x.toFixed(1)}, y: ${p.y.toFixed(1)}, sentence: "${p.sentence.replace(/"/g,'\\"')}" },`
  );
  document.getElementById('exportText').value = "const parts = [\n" + lines.join("\n") + "\n];";
}

document.getElementById('replayBtn').addEventListener('click', () => {
  if (lastSentence) speak(lastSentence);
  else speak("Click a circle first to hear a word.");
});

document.getElementById('wordBox').addEventListener('click', () => {
  if (lastSentence) speak(lastSentence);
});

document.getElementById('revealBtn').addEventListener('click', (e) => {
  const showing = document.querySelectorAll('.hotspot.show-label').length > 0;
  document.querySelectorAll('.hotspot').forEach(el => el.classList.toggle('show-label', !showing));
  e.target.textContent = showing ? "👁️ Show all labels" : "🙈 Hide labels";
});

document.getElementById('editBtn').addEventListener('click', (e) => {
  editMode = !editMode;
  quizMode = false;
  document.getElementById('editBanner').classList.toggle('show', editMode);
  document.getElementById('exportBox').classList.toggle('show', editMode);
  e.target.textContent = editMode ? "✅ Done editing" : "✏️ Fix hotspots";
  if (editMode) updateExportBox();
  renderHotspots();
});

function startQuiz() {
  quizMode = true;
  editMode = false;
  document.getElementById('editBanner').classList.remove('show');
  document.getElementById('exportBox').classList.remove('show');
  quizQueue = [...parts].sort(() => Math.random() - 0.5);
  nextQuizQuestion();
}

function nextQuizQuestion() {
  document.querySelectorAll('.hotspot').forEach(el => el.classList.remove('correct', 'wrong'));
  if (quizQueue.length === 0) quizQueue = [...parts].sort(() => Math.random() - 0.5);
  quizAnswer = quizQueue.shift();
  document.getElementById('quizFeedback').textContent = "Find: " + quizAnswer.label;
  speak("Find the " + quizAnswer.label);
}

function handleQuizClick(part, el) {
  if (part.id === quizAnswer.id) {
    el.classList.add('correct');
    document.getElementById('quizFeedback').textContent = "✅ Correct! That's the " + part.label + ".";
    speak("Correct! That's the " + part.label + ".");
    setTimeout(nextQuizQuestion, 3500);
  } else {
    el.classList.add('wrong');
    document.getElementById('quizFeedback').textContent = "❌ Not quite — try again.";
    speak("Not quite, try again.");
  }
}

document.getElementById('quizBtn').addEventListener('click', (e) => {
  if (!quizMode) {
    startQuiz();
    e.target.textContent = "⏹ Stop quiz";
  } else {
    quizMode = false;
    document.getElementById('quizFeedback').textContent = "";
    document.querySelectorAll('.hotspot').forEach(el => el.classList.remove('correct', 'wrong'));
    e.target.textContent = "🎯 Quiz me";
  }
});

renderHotspots();
</script>
</body>
</html>
